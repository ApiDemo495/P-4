# =============================================================================
# Build the pre-provisioned dev-container image (Python deps already installed)
# and push it to GHCR.  A new Codespace then pulls one cached image instead of
# running apt + pip, so "create codespace" -> running engine takes well under
# a minute.  Re-runs only when requirements or the Dockerfile change.
# =============================================================================
name: devcontainer-image

on:
  push:
    branches: ["arena/**"]
    paths:
      - "requirements.txt"
      - ".devcontainer/Dockerfile"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch: {}

concurrency:
  group: devcontainer-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/apidemo495/p-4-dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
