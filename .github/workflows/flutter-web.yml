# =============================================================================
# Build the Flutter web client on GitHub's runners and commit the bundle to
# THIS branch (frontend/build/web).  A Codespace then never has to download
# the 700 MB SDK: the engine serves the committed bundle at /flutter the
# moment the branch is checked out, and the in-Codespace download becomes a
# fallback instead of the only route.
#
# The bundle has no API_BASE baked in: on the web the Dart client uses
# Uri.base.origin, so the same build works on any Codespace URL / localhost.
# =============================================================================
name: flutter-web

on:
  push:
    branches: ["arena/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/flutter-web.yml"
  workflow_dispatch: {}

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    # the commit this workflow makes carries [skip ci]; this guard is the belt
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the web bundle (served by the engine at /flutter)
        working-directory: frontend
        env:
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          CI: "true"
        id: build
        run: |
          set -o pipefail
          {
            flutter --version
            flutter config --enable-web
            test -f web/index.html || flutter create . --platforms web --project-name drosophila_trader
            flutter pub get
            flutter build web --release --base-href /flutter/
            test -f build/web/index.html
          } 2>&1 | tee /tmp/flutter-build.log

      - name: Publish the build log where it can be read without the Actions UI
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### flutter build web failed (run ${{ github.run_id }}, ${GITHUB_SHA::8})"
            echo '```'
            grep -v "^Downloading\|^Resolving\|^Got dependencies" /tmp/flutter-build.log | tail -150
            echo '```'
          } > /tmp/comment.md
          cat /tmp/comment.md >> "$GITHUB_STEP_SUMMARY"
          PR=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number' || true)
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file /tmp/comment.md || true; fi

      - name: Commit the bundle to this branch (fast-forward only, never main)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/commit_flutter_bundle.sh
